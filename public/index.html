<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080c14">
<title>x8music</title>
<style>
  :root {
    color-scheme: dark;
    --background: #080c14;
    --sidebar: #0a0f19;
    --surface: #0d1421;
    --surface-hover: #111d30;
    --border: #172235;
    --text: #f3f5f9;
    --muted: #9aa8bd;
    --accent: #4d85f5;
    --accent-bright: #5e91ff;
    --accent-soft: #182a48;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-width: 320px;
    height: 100vh;
    overflow: hidden;
    background: var(--background);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button, input { font: inherit; }
  button { color: inherit; }
  .app { display: flex; width: 100%; height: 100%; }
  .sidebar {
    display: flex;
    flex: 0 0 240px;
    flex-direction: column;
    min-width: 0;
    background: var(--sidebar);
    border-right: 1px solid #101827;
  }
  .brand {
    display: block;
    padding: 25px 24px 24px;
    color: var(--text);
    font-size: 1.35rem;
    font-weight: 750;
    letter-spacing: -0.04em;
  }
  .nav { display: grid; gap: 5px; padding: 0 12px; }
  .nav button {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: 46px;
    padding: 0 13px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    text-align: left;
    cursor: pointer;
  }
  .nav button:hover, .nav button.active { background: var(--surface-hover); color: var(--text); }
  .nav button.active { font-weight: 650; }
  .icon { width: 19px; height: 19px; flex: 0 0 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .side-label {
    padding: 26px 24px 10px;
    color: var(--muted);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .playlist-empty { padding: 27px 18px 0; color: var(--muted); font-size: 0.85rem; text-align: center; }
  .playlist-create {
    display: block;
    margin: 14px auto 0;
    padding: 9px 16px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 650;
  }
  .side-bottom { margin-top: auto; padding: 15px 24px; border-top: 1px solid #121b2a; color: var(--muted); font-size: 0.85rem; }
  .main { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 66px;
    padding: 10px 24px;
    border-bottom: 1px solid #101827;
  }
  .topbar-title { display: none; flex: 0 0 auto; font-size: 1.05rem; font-weight: 700; }
  .search-form { display: flex; align-items: center; flex: 1; gap: 10px; min-width: 0; }
  .search-box {
    display: flex;
    align-items: center;
    flex: 1;
    gap: 12px;
    min-width: 0;
    height: 46px;
    padding: 0 14px;
    border: 1px solid #1b2638;
    border-radius: 13px;
    background: #0c121d;
    color: var(--muted);
  }
  .search-box:focus-within { border-color: #314d78; }
  .search-box input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 0.97rem; }
  .search-box input::placeholder { color: #8896aa; }
  .search-submit {
    height: 42px;
    padding: 0 17px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-weight: 650;
    cursor: pointer;
  }
  .search-submit:hover, .playlist-create:hover { background: var(--accent-bright); }
  .source-label { flex: 0 0 auto; padding: 11px 13px; border: 1px solid #1b2638; border-radius: 10px; color: #d6deeb; font-size: 0.83rem; }
  .profile { display: grid; width: 34px; height: 34px; place-items: center; color: var(--muted); }
  .content { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 26px 32px; scrollbar-color: #26344b transparent; }
  .view[hidden] { display: none; }
  .section { margin: 4px 0 29px; }
  .section-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 17px; font-size: 1rem; font-weight: 720; letter-spacing: -0.02em; }
  .section-heading .icon { width: 16px; height: 16px; flex-basis: 16px; color: #9bbaff; }
  .cards {
    display: grid;
    grid-auto-columns: minmax(150px, 190px);
    grid-auto-flow: column;
    gap: 14px;
    overflow-x: auto;
    padding: 0 2px 9px;
    scrollbar-color: #26344b transparent;
  }
  .card { min-width: 0; cursor: pointer; }
  .card-art {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 13px;
    background: var(--surface);
    object-fit: cover;
  }
  .card-title { overflow: hidden; margin: 9px 0 3px; color: var(--text); font-size: 0.9rem; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
  .card-subtitle { overflow: hidden; color: var(--muted); font-size: 0.79rem; text-overflow: ellipsis; white-space: nowrap; }
  .card.artist-card .card-art { border-radius: 50%; }
  .card:hover .card-title { color: #aac6ff; }
  .track-list { display: grid; gap: 2px; }
  .track {
    display: grid;
    grid-template-columns: 34px 44px minmax(0, 1fr) minmax(100px, 0.45fr) 50px;
    align-items: center;
    gap: 12px;
    min-height: 65px;
    padding: 7px 12px;
    border-radius: 11px;
    cursor: pointer;
  }
  .track:hover { background: var(--surface-hover); }
  .track.playing { background: var(--accent-soft); }
  .card.playing .card-title { color: var(--accent-bright); }
  .track-number { color: var(--muted); text-align: center; font-size: 0.84rem; }
  .track-art { width: 42px; height: 42px; border-radius: 8px; background: var(--surface); object-fit: cover; }
  .track-meta { overflow: hidden; }
  .track-title { overflow: hidden; font-size: 0.9rem; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
  .track-artist, .track-album, .track-duration { overflow: hidden; color: var(--muted); font-size: 0.79rem; text-overflow: ellipsis; white-space: nowrap; }
  .track.playing .track-title { color: var(--accent-bright); }
  .status { padding: 46px 16px; color: var(--muted); text-align: center; }
  .search-summary { margin: 0 0 18px; color: var(--muted); font-size: 0.85rem; }
  .now-playing { display: flex; align-items: center; flex: 0 0 auto; gap: 12px; min-width: 180px; max-width: 30%; }
  .now-playing img { width: 44px; height: 44px; border-radius: 7px; background: var(--surface); object-fit: cover; }
  .now-playing-meta { overflow: hidden; }
  .now-playing-title, .now-playing-artist { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now-playing-title { font-size: 0.85rem; font-weight: 650; }
  .now-playing-artist { margin-top: 3px; color: var(--muted); font-size: 0.76rem; }
  .player-bar {
    display: flex;
    align-items: center;
    gap: 22px;
    min-height: 78px;
    padding: 10px 22px;
    border-top: 1px solid #172235;
    background: #090e17;
  }
  audio { width: min(520px, 48vw); height: 42px; margin-left: auto; }
  @media (max-width: 760px) {
    .sidebar { flex-basis: 72px; }
    .brand { padding: 22px 0; text-align: center; font-size: 0; }
    .brand::after { content: "M"; font-size: 1.3rem; }
    .nav { padding: 0 8px; }
    .nav button { justify-content: center; padding: 0; font-size: 0; }
    .nav button .icon { width: 21px; height: 21px; }
    .side-label, .playlist-empty, .playlist-create, .side-bottom { display: none; }
    .topbar { gap: 9px; padding: 9px 12px; }
    .topbar-title { display: block; }
    .source-label, .profile { display: none; }
    .search-submit { padding: 0 12px; }
    .content { padding: 20px 14px 28px; }
    .cards { grid-auto-columns: minmax(130px, 160px); gap: 11px; }
    .player-bar { gap: 10px; padding: 9px 12px; }
    .now-playing { max-width: 44%; min-width: 0; }
    .now-playing img { width: 38px; height: 38px; }
    audio { width: min(220px, 48vw); }
    .track { grid-template-columns: 24px 40px minmax(0, 1fr) 40px; gap: 8px; padding: 7px 5px; }
    .track-album { display: none; }
  }
  @media (max-width: 460px) {
    .sidebar { flex-basis: 58px; }
    .search-submit { width: 42px; padding: 0; overflow: hidden; font-size: 0; }
    .search-submit::after { content: "⌕"; font-size: 1.3rem; }
    .player-bar { flex-wrap: wrap; }
    .now-playing { max-width: 100%; flex: 1 1 100%; }
    audio { width: 100%; margin: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Music</div>
    <nav class="nav" aria-label="Main navigation">
      <button class="active" type="button" data-view="browse" aria-current="page">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1.3 3.1.3 4.8-.5 6.2-.8 1.4-1.5 2.5-.2 4.1 1.8-1.1 2.8-2.5 3.2-4.1 3 2.3 4.6 5.3 3.5 8.2A6.5 6.5 0 0 1 5.5 15c0-2.4 1.3-4.3 3-5.8-.1 2 .4 3.2 1.4 3.9C10.7 10 11 6.7 12 3Z"/></svg>
        Browse
      </button>
      <button type="button" data-view="search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        Search
      </button>
      <button type="button" data-view="library">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h15M4 11h15M4 16h9"/><circle cx="18" cy="17" r="3"/></svg>
        Your Library
      </button>
    </nav>
    <div class="side-label">Playlists</div>
    <div class="playlist-empty">Create your first playlist</div>
    <button class="playlist-create" id="newPlaylistBtn" type="button">＋&nbsp; New Playlist</button>
    <div class="side-bottom">▦&nbsp;&nbsp; Shortcuts</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">Browse</div>
      <form class="search-form" id="searchForm" role="search">
        <label class="search-box">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="q" type="search" placeholder="What do you want to listen to?" autocomplete="off">
        </label>
        <button class="search-submit" id="searchBtn" type="submit">Search</button>
      </form>
      <div class="source-label">YouTube Music</div>
      <div class="profile" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20v-1.5A5.5 5.5 0 0 1 9 13h.5a5.5 5.5 0 0 1 5.5 5.5V20M16 5.5a3 3 0 0 1 0 5.8m2 2.2a5 5 0 0 1 2.5 4.4V20"/></svg>
      </div>
    </header>
    <div class="content">
      <section class="view" id="browseView" aria-label="Browse">
        <div class="status">Loading music…</div>
      </section>
      <section class="view" id="searchView" aria-label="Search results" hidden>
        <div class="status">Start typing to search.</div>
      </section>
      <section class="view" id="libraryView" aria-label="Your library" hidden>
        <div class="status">Under construction — Your Library will be ready soon.</div>
      </section>
      <section class="view" id="playlistsView" aria-label="New playlist" hidden>
        <div class="status">Under construction — playlists will be ready soon.</div>
      </section>
    </div>
    <footer class="player-bar">
      <div class="now-playing" id="nowPlaying">
        <img id="nowPlayingArt" alt="" hidden>
        <div class="now-playing-meta">
          <div class="now-playing-title" id="nowPlayingTitle">Nothing playing</div>
          <div class="now-playing-artist" id="nowPlayingArtist">Choose a track to get started</div>
        </div>
      </div>
      <audio id="player" controls></audio>
    </footer>
  </main>
</div>
<script>
const q = document.getElementById('q');
const player = document.getElementById('player');
const browseView = document.getElementById('browseView');
const searchView = document.getElementById('searchView');
const libraryView = document.getElementById('libraryView');
const playlistsView = document.getElementById('playlistsView');
const pageTitle = document.getElementById('pageTitle');
const nowPlayingTitle = document.getElementById('nowPlayingTitle');
const nowPlayingArtist = document.getElementById('nowPlayingArtist');
const nowPlayingArt = document.getElementById('nowPlayingArt');
let selectedTrack = null;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[char]));
}

function showView(name) {
  browseView.hidden = name !== 'browse';
  searchView.hidden = name !== 'search';
  libraryView.hidden = name !== 'library';
  playlistsView.hidden = name !== 'playlists';
  pageTitle.textContent = name === 'library' ? 'Your Library' : name === 'playlists' ? 'New Playlist' : name[0].toUpperCase() + name.slice(1);
  document.querySelectorAll('.nav button[data-view]').forEach((button) => {
    const active = button.dataset.view === name;
    button.classList.toggle('active', active);
    if (active) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
  if (name === 'search') q.focus();
}

function sectionIcon(kind) {
  if (kind === 'albums') return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></svg>';
  if (kind === 'tracks') return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>';
  if (kind === 'pop') return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Zm6 12 .9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9L18 15Z"/></svg>';
  return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>';
}

function createSection(title, kind, entries, type) {
  if (!entries?.length) return '';
  const cards = entries.map((entry) => {
    const isAlbum = type === 'album';
    const isArtist = type === 'artist';
    const titleText = isAlbum ? entry.title : isArtist ? entry.name : entry.title;
    const subtitle = isAlbum ? entry.artist?.name : isArtist ? 'Artist' : entry.artist;
    const artwork = isAlbum ? entry.cover : isArtist ? entry.picture : entry.artwork;
    const data = isAlbum
      ? `data-search="${escapeHtml(entry.title)}"`
      : isArtist
        ? `data-search="${escapeHtml(entry.name)}"`
        : `data-track="${escapeHtml(JSON.stringify(entry))}"`;
    return `<article class="card${isArtist ? ' artist-card' : ''}" ${data} tabindex="0" role="button">
      <img class="card-art" src="${escapeHtml(artwork)}" alt="" loading="lazy">
      <div class="card-title">${escapeHtml(titleText)}</div>
      <div class="card-subtitle">${escapeHtml(subtitle)}</div>
    </article>`;
  }).join('');
  return `<section class="section"><h2 class="section-heading">${sectionIcon(kind)}${escapeHtml(title)}</h2><div class="cards">${cards}</div></section>`;
}

function renderBrowse(data) {
  const sections = [
    createSection('New albums', 'albums', data.albums, 'album'),
    createSection('Top Hits', 'tracks', data.rows?.hits, 'track'),
    createSection('Pop', 'pop', data.rows?.pop, 'track'),
    createSection('Hip-Hop', 'tracks', data.rows?.hiphop, 'track'),
    createSection('Indie', 'tracks', data.rows?.indie, 'track'),
    createSection('Rock', 'tracks', data.rows?.rock, 'track'),
    createSection('R&B', 'tracks', data.rows?.rnb, 'track'),
    createSection('Latin', 'tracks', data.rows?.latin, 'track'),
    createSection('Electronic', 'tracks', data.rows?.electronic, 'track'),
    createSection('K-Pop', 'tracks', data.rows?.kpop, 'track'),
    createSection('Chill', 'tracks', data.rows?.chill, 'track'),
  ].filter(Boolean);
  browseView.innerHTML = sections.length ? sections.join('') : '<div class="status">No browse music is available right now.</div>';
  bindCards(browseView);
}

function renderTracks(tracks) {
  return `<div class="track-list">${tracks.map((track, index) => {
    const isPlaying = selectedTrack && String(selectedTrack.id) === String(track.id);
    return `<div class="track${isPlaying ? ' playing' : ''}" data-track="${escapeHtml(JSON.stringify(track))}" role="button" tabindex="0">
      <div class="track-number">${isPlaying ? '♫' : index + 1}</div>
      <img class="track-art" src="${escapeHtml(track.artwork)}" alt="" loading="lazy">
      <div class="track-meta"><div class="track-title">${escapeHtml(track.title)}</div><div class="track-artist">${escapeHtml(track.artist)}</div></div>
      <div class="track-album">${escapeHtml(track.album)}</div>
      <div class="track-duration">${formatDuration(track.duration)}</div>
    </div>`;
  }).join('')}</div>`;
}

function formatDuration(seconds) {
  const value = Number(seconds);
  if (!Number.isFinite(value) || value <= 0) return '';
  return `${Math.floor(value / 60)}:${String(Math.floor(value % 60)).padStart(2, '0')}`;
}

function bindCards(container) {
  container.querySelectorAll('[data-track]').forEach((card) => {
    const activate = () => {
      try {
        play(JSON.parse(card.dataset.track), card);
      } catch (error) {
        console.error('Could not open this track.', error);
      }
    };
    card.addEventListener('click', activate);
    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activate();
      }
    });
  });
  container.querySelectorAll('[data-search]').forEach((card) => {
    const activate = () => {
      q.value = card.dataset.search;
      showView('search');
      search();
    };
    card.addEventListener('click', activate);
    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activate();
      }
    });
  });
}

function renderSearch(data) {
  const sections = [
    createSection('Artists', 'artists', data.artists, 'artist'),
    createSection('Albums', 'albums', data.albums, 'album'),
  ].filter(Boolean);
  const tracks = data.items || [];
  if (tracks.length) sections.push(`<section class="section"><h2 class="section-heading">${sectionIcon('tracks')}Tracks</h2>${renderTracks(tracks)}</section>`);
  searchView.innerHTML = `<p class="search-summary">${tracks.length} ${tracks.length === 1 ? 'track' : 'tracks'}</p>${sections.length ? sections.join('') : '<div class="status">No results found.</div>'}`;
  bindCards(searchView);
}

async function search() {
  const query = q.value.trim();
  if (!query) return;
  showView('search');
  searchView.innerHTML = '<div class="status">Searching…</div>';
  try {
    const response = await fetch('/api/music/search?q=' + encodeURIComponent(query));
    if (!response.ok) throw new Error(`Search request failed (${response.status}).`);
    renderSearch(await response.json());
  } catch (error) {
    console.error('Search failed.', error);
    searchView.innerHTML = '<div class="status">Search failed. Check the server and try again.</div>';
  }
}

function play(track, element) {
  document.querySelectorAll('.track.playing').forEach((item) => item.classList.remove('playing'));
  document.querySelectorAll('.card.playing').forEach((item) => item.classList.remove('playing'));
  element?.classList.add('playing');
  selectedTrack = track;
  nowPlayingTitle.textContent = track.title || 'Unknown track';
  nowPlayingArtist.textContent = track.artist || '';
  nowPlayingArt.src = track.artwork || '';
  nowPlayingArt.hidden = !track.artwork;

  const params = new URLSearchParams({ id: String(track.id) });
  if (track.isrc) params.set('isrc', track.isrc);
  if (track.source) params.set('source', track.source);
  if (track.title) params.set('title', track.title);
  if (track.artist) params.set('artist', track.artist);
  if (track.duration) params.set('duration', String(track.duration));
  player.src = '/api/music/stream?' + params.toString();
  player.play().catch((error) => console.warn('Playback could not start.', error));
  document.querySelectorAll('.track').forEach((item) => {
    if (item.dataset.track) {
      try {
        if (String(JSON.parse(item.dataset.track).id) === String(track.id)) item.classList.add('playing');
      } catch { /* Ignore tracks whose metadata is no longer available. */ }
    }
  });
}

async function loadBrowse() {
  browseView.innerHTML = '<div class="status">Loading music…</div>';
  try {
    const response = await fetch('/api/music/browse');
    if (!response.ok) throw new Error(`Browse request failed (${response.status}).`);
    renderBrowse(await response.json());
  } catch (error) {
    console.error('Browse failed.', error);
    browseView.innerHTML = '<div class="status">Could not load browse music. Try again later.</div>';
  }
}

document.getElementById('searchForm').addEventListener('submit', (event) => {
  event.preventDefault();
  search();
});
document.querySelectorAll('.nav button[data-view]').forEach((button) => {
  button.addEventListener('click', () => showView(button.dataset.view));
});
document.getElementById('newPlaylistBtn').addEventListener('click', () => showView('playlists'));
player.addEventListener('error', () => {
  nowPlayingArtist.textContent = 'Could not play this track. Check the server log.';
});

loadBrowse();
fetch('/api/music/source').then(async (response) => {
  if (!response.ok) throw new Error(`Source status request failed (${response.status}).`);
  return response.json();
}).then((source) => {
  if (source.configured && !source.configured.ytm) {
    const message = document.createElement('div');
    message.className = 'status';
    message.textContent = 'Search works, but playback needs YTM_BASE to be set. See .env.example.';
    browseView.prepend(message);
  }
}).catch((error) => console.error('Could not load source status.', error));
</script>
</body>
</html>
